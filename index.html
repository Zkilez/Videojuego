<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planeta LESGILACION - Menú Principal</title>
    <link rel="stylesheet" href="./css/menu.css">
</head>
<body>
    <div id="menu-container">
        <div id="stars-container"></div>
        <div id="grid-overlay"></div>
        
        <div class="floating-circuit left"></div>
        <div class="floating-circuit right"></div>
        
        <div class="planet-hologram">
            <div class="planet-core"></div>
            <div class="planet-ring"></div>
            <div class="planet-orbit"></div>
            <div class="planet-satellite"></div>
        </div>
        
        <div class="title-container">
            <h1 class="game-title">PLANETA LEGISLACION</h1>
            <div class="title-underline"></div>
            <p class="game-subtitle">PROTEGE EL MUNDO </p>
        </div>
        
        <div class="menu-options">
            <button id="play-button" class="menu-button">
                <span class="button-glow"></span>
                <span class="button-text">JUGAR</span>
            </button>
        </div>
        
        <div class="data-stream left"></div>
        <div class="data-stream right"></div>
        
        <div class="corner-decoration top-left"></div>
        <div class="corner-decoration top-right"></div>
        <div class="corner-decoration bottom-left"></div>
        <div class="corner-decoration bottom-right"></div>
    </div>

    <script src="./js/menu.js"></script>
</body>
</html>
